apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-gateway
  namespace: gateway-demo
spec:
  gatewayClassName: eg
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: tls.demo.local
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: demo-tls
    allowedRoutes:
      namespaces:
        from: Same
