apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: limited-route
  namespace: gateway-demo
spec:
  parentRefs:
  - name: demo-gateway
  hostnames:
  - demo.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /limited
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: blue
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slow-route
  namespace: gateway-demo
spec:
  parentRefs:
  - name: demo-gateway
  hostnames:
  - demo.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /slow
    backendRefs:
    - name: slow-backend
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shape-route
  namespace: gateway-demo
spec:
  parentRefs:
  - name: demo-gateway
  hostnames:
  - demo.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /shape
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: blue
      port: 80
      weight: 80
    - name: green
      port: 80
      weight: 20

